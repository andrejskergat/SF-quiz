  }

  *{box-sizing:border-box;}

  html,body{margin:0;padding:0;}

  body{

  .eyebrow{
    font-family:'JetBrains Mono',monospace;

    color:var(--stone);
    margin:0 0 14px;
  }

  h1{

  }

  .subtitle{
    color:var(--stone);
    font-size:16px;
    margin:0 0 28px;
  }

  .question-text{
    font-family:'Fraunces',serif;

    font-size:26px;

    margin:0 0 24px;

    top:11px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--ink);

    font-size:12px;
    letter-spacing:0.06em;
    color:var(--stone);
    margin:0 0 26px;
  }

  .btn{
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:600;
    border-radius:14px;
    padding:16px 24px;
    border:none;
    cursor:pointer;
    transition:transform 0.12s ease,background 0.2s ease,opacity 0.2s ease;

  .btn-primary{
    background:var(--marigold);
    color:var(--ink);
  }
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-primary:disabled{
    background:var(--ink-track);
    color:var(--stone);
    cursor:not-allowed;
    transform:none;
  }
  .btn-ghost{
    background:transparent;
    color:var(--ink);

    padding:14px 22px;

    padding:16px 18px;

    inset:3px;
    border-radius:50%;
    background:var(--ink);

    font-weight:500;
    font-size:19px;

    background:var(--ink-fill);

    font-family:'Fraunces',serif;

    font-size:22px;

    text-align:center;
    text-decoration:none;
  }

    font-size:13px;
    color:var(--stone);
    line-height:1.55;
    margin:32px 0 0;

    h1{font-size:28px;}

    body{font-size:16px;}
  }

  @media (prefers-reduced-motion:reduce){
    .screen{animation:none;}
    .progress-fill,.btn-primary{transition:none;}
  }
</style>

// GHL contact ID, passed through the page URL when the quiz is loaded from
// inside a GHL funnel/website page for a known contact. Checked against the
// common param name variants GHL uses; whichever is present on the live URL
// wins. Sent up with the webhook payload so the workflow can match against
// an existing contact instead of creating a duplicate.
function getContactIdFromUrl(){
  const params = new URLSearchParams(window.location.search);
  return params.get("contact_id") || params.get("contactId")
      || params.get("cid") || params.get("cId") || null;
}
const CONTACT_ID = getContactIdFromUrl();

/* ---------- helpers ---------- */
function esc(s){
  return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function optLabel(q,i){
  return q.scored ? q.options[i][0] : q.options[i];
}
function optPts(q,i){
  return q.scored ? q.options[i][1] : 0;
}

/* ============================================================
   OUTER-FRAME AUTO RESIZE
   If this whole quiz is itself embedded inside another iframe or
   popup (e.g. a GHL/Elementor popup on the site), that host
   container has no way to know when this page's own content height
   changes, most importantly once the nested booking calendar
   expands through its own steps (date -> time slots -> enter
   details). This continuously reports this page's real height to
   window.parent via postMessage, in a few of the common formats
   host tools tend to listen for, so the outer frame can resize to
   match at all times rather than clipping.
   ============================================================ */
function render(){
  if(state.screen==="intro")      renderIntro();
  else if(state.screen==="lead")  renderLead();
  else if(state.screen==="result")renderResult();
  else                            renderQuestion(state.screen);
  app.scrollTop=0;
  window.scrollTo(0,0);
}

function renderQuestion(i){
  const q = QUESTIONS[i];
  const total = QUESTIONS.length;
  const pct = ((i+1)/total)*100;
  const sel = state.answers[i];

  const opts = q.options.map((_,idx)=>{
    const checked = sel===idx;
    return `<button class="option" role="radio" aria-checked="${checked}" data-idx="${idx}">
      <span class="dot" aria-hidden="true"></span>
      <span>${esc(optLabel(q,idx))}</span>
    </button>`;
  }).join("");

  app.innerHTML = `
    <div class="screen">
      <div class="progress-head">
        <span class="progress-count">Question ${i+1} of ${total}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p class="question-text">${esc(q.text)}</p>
      <div class="options" role="radiogroup" aria-label="${esc(q.text)}">${opts}</div>
      <div class="nav-row">
        <button class="btn btn-ghost" id="back">Back</button>
        <button class="btn btn-primary" id="next" ${sel===null?"disabled":""}>Next</button>
      </div>
    </div>`;

  app.querySelectorAll(".option").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const idx = parseInt(btn.dataset.idx,10);
      state.answers[i]=idx;
      app.querySelectorAll(".option").forEach(b=>b.setAttribute("aria-checked", b.dataset.idx===String(idx)?"true":"false"));
      document.getElementById("next").disabled=false;

      // Auto-advance shortly after picking an answer, so the selection is
      // visible for a beat before moving on. The Next/Back buttons stay as
      // a manual fallback (e.g. if someone wants to review/change first).
      // The state.screen check guards against firing after the person has
      // already navigated away (via Back, or a second quick option click).
      setTimeout(()=>{
        if(state.screen!==i) return;
        if(i===total-1) state.screen="lead";
        else state.screen=i+1;
        render();
      }, 320);
    });
  });

  document.getElementById("back").addEventListener("click",()=>{
    if(i===0) state.screen="intro";
    else state.screen=i-1;
    render();
  });
  document.getElementById("next").addEventListener("click",()=>{
    if(state.answers[i]===null) return;
    if(i===total-1) state.screen="lead";
    else state.screen=i+1;
    render();
  });
}

function setFieldError(field, valid, message){
  const input=document.getElementById("f-"+field);

    input.classList.remove("invalid");
    err.classList.remove("show");
  } else {

    if(message) err.textContent=message;
    err.classList.add("show");
  }
}

// Accepts Singapore mobile numbers only (landlines start with 6 and can't
// receive WhatsApp). Strips spaces, dashes, brackets, and an optional
// leading + or 65/0065 country code, then checks for 8 digits starting
// with 8 or 9.
function isValidSGNumber(raw){
  let digits = raw.replace(/[^\d]/g,"");
  if(digits.startsWith("0065")) digits = digits.slice(4);
  else if(digits.startsWith("65") && digits.length>8) digits = digits.slice(2);
  return /^[89]\d{7}$/.test(digits);
}

/* ============================================================
   SCORING
   ============================================================ */
function computeScores(){
  const scores={}; AREAS.forEach(a=>scores[a.key]=0);
  QUESTIONS.forEach((q,i)=>{
    if(q.scored && state.answers[i]!==null){
      scores[q.area]+=optPts(q,state.answers[i]);
    }
  });
  const total=AREAS.reduce((s,a)=>s+scores[a.key],0);

  const band = total>=32 ? "high" : (total>=16 ? "middle" : "low");

  const pct={};
  AREAS.forEach(a=>{ pct[a.key]=Math.round((scores[a.key]/a.max)*100); });

  // lowest area by share of own max; tie -> earliest in AREAS order
  let lowest=AREAS[0].key, lowestShare=scores[AREAS[0].key]/AREAS[0].max;
  AREAS.forEach(a=>{
    const share=scores[a.key]/a.max;
    if(share<lowestShare-1e-9){ lowestShare=share; lowest=a.key; }
  });

  // opportunity area: lowest by share among these four only.
  // "Keeping families and earning referrals" is never the opportunity.
  // Tie -> earliest in OPP_KEYS order.
  const OPP_KEYS=["found","trust","enquiries","signups"];
  let oppArea=OPP_KEYS[0];
  let oppShare=scores[oppArea]/AREAS.find(a=>a.key===oppArea).max;
  OPP_KEYS.forEach(k=>{
    const a=AREAS.find(x=>x.key===k);
    const share=scores[k]/a.max;
    if(share<oppShare-1e-9){ oppShare=share; oppArea=k; }
  });

  // strengths: every area at/above cutoff; else single highest by share
  let strengths=AREAS.filter(a=>scores[a.key]>=a.cutoff).map(a=>a.key);
  if(strengths.length===0){
    let top=AREAS[0].key, topShare=scores[AREAS[0].key]/AREAS[0].max;
    AREAS.forEach(a=>{
      const share=scores[a.key]/a.max;
      if(share>topShare+1e-9){ topShare=share; top=a.key; }
    });
    strengths=[top];
  }

  return { scores, total, band, pct, lowest, lowestShare, oppArea, oppShare, strengths };
}

/* ============================================================
   QUALIFIES + payload
   ============================================================ */
function getAnswerText(key){
  const i=QUESTIONS.findIndex(q=>q.key===key);
  if(i<0 || state.answers[i]===null) return null;
  return optLabel(QUESTIONS[i], state.answers[i]);
}

function computeQualifies(){
  const type=getAnswerText("centreType");
  const spend=getAnswerText("spend");
  return FIT_TYPES.includes(type) && FIT_SPEND.includes(spend);
}

<div style="max-width:560px;margin:0 auto;${f}">

function submitPayload(){
  const sc=computeScores();
  const qualifies=computeQualifies();

  const areaScores={};
  AREAS.forEach(a=>{
    areaScores[a.key]={ name:a.name, raw:sc.scores[a.key], max:a.max, percent:sc.pct[a.key] };
  });

  const payload={
    contact:{
      name:state.lead.name,
      centreName:state.lead.centre,
      email:state.lead.email,
      whatsapp:state.lead.whatsapp
    },
    qualifyingAnswers:{
      centreType:getAnswerText("centreType"),
      locations:getAnswerText("locations"),
      ads:getAnswerText("ads"),
      monthlySpend:getAnswerText("spend"),
      whoHandlesMarketing:getAnswerText("whoHandles"),
      aiUse:getAnswerText("aiUse"),
      intent:getAnswerText("intent")
    },
    areaScores:areaScores,
    overallScore:sc.total,        // out of 48, never shown to user
    overallMax:48,
    band:sc.band,                 // high | middle | low
    lowestArea:sc.lowest,
    qualifies:qualifies,
    timestamp:new Date().toISOString()
  };

  // Results email is sent via GHL (see GHL_WEBHOOK_URL below), which
  // receives results_html ready to drop into a Send Email workflow step.
  console.log("Enrolment quiz submission:", payload);

  if(MAKE_WEBHOOK_URL){
    fetch(MAKE_WEBHOOK_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(payload)
    }).catch(err=>console.error("Webhook POST failed:", err));
  }

  // GHL CRM sync: flat payload so every quiz answer maps cleanly onto a
  // contact custom field via the Inbound Webhook trigger's field picker.
  // results_html is a ready-made HTML block of the full result screen
  // (inline-styled, table-based, email-client-safe) for a GHL "Send
  // Email" step to insert directly, e.g. via a custom value or the
  // workflow's raw HTML block, so the email doesn't need to be rebuilt
  // by hand from the individual quiz_* fields.
  if(GHL_WEBHOOK_URL){
    const ghlPayload={
      contact_id:CONTACT_ID,
      email:state.lead.email,
      phone:state.lead.whatsapp,
      first_name:state.lead.name.split(/\s+/)[0] || state.lead.name,
      full_name:state.lead.name,
      company_name:state.lead.centre,
      quiz_centre_type:payload.qualifyingAnswers.centreType,
      quiz_locations:payload.qualifyingAnswers.locations,
      quiz_running_ads:payload.qualifyingAnswers.ads,
      quiz_monthly_spend:payload.qualifyingAnswers.monthlySpend,
      quiz_who_handles_marketing:payload.qualifyingAnswers.whoHandlesMarketing,
      quiz_ai_use:payload.qualifyingAnswers.aiUse,
      quiz_intent:payload.qualifyingAnswers.intent,
      quiz_score_getting_found:areaScores.found.raw,
      quiz_score_trust:areaScores.trust.raw,
      quiz_score_enquiries:areaScores.enquiries.raw,
      quiz_score_signups:areaScores.signups.raw,
      quiz_score_keeping:areaScores.keeping.raw,
      quiz_overall_score:sc.total,
      quiz_overall_max:48,
      quiz_band:sc.band,
      quiz_lowest_area:sc.lowest,
      quiz_qualifies:qualifies,
      quiz_completed_at:payload.timestamp,
      results_html:buildResultsEmailHtml(sc, qualifies)
    };
    fetch(GHL_WEBHOOK_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(ghlPayload)
    }).catch(err=>console.error("GHL webhook POST failed:", err));
  }

  // Meta Pixel: report the completed quiz back to Meta for optimisation
  // and retargeting. Lead is the standard event Meta uses for reporting/
  // bidding; QuizCompletion is a custom event for finer-grained tracking.
  if(typeof fbq==="function"){
    fbq('track','Lead',{
      content_name:'Enrolment Marketing Quiz',
      status:qualifies ? 'qualified' : 'not_qualified'
    });
    fbq('trackCustom','QuizCompletion',{
      band:sc.band,
      qualifies:qualifies
    });
  }
}
